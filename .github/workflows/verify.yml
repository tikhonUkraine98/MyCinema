name: Verify MyCinema

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML and JavaScript
        run: |
          node tests/verify.mjs
          node tests/browser-smoke.mjs
